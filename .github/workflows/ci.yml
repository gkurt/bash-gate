name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    # Linux, so test/bash.test.ts checks the analysis against a real Linux Bash.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun i --frozen-lockfile
      - run: bun check
      - run: bun run test
        env:
          PROPERTY_RUNS: 5000
          BASH_RUNS: 1000
          TRACE_RUNS: 500
      - run: bun typecheck
      - run: bun run build
      # The built package, as Node loads it.
      - run: node --input-type=module -e "import { check, recommended } from './dist/index.js'; if (check('rm -rf /', recommended).decision !== 'deny') process.exit(1);"
      # Layer 3 as Node loads it: the supervisor builds from dist/supervisor.c, and an exec it didn't predict is refused.
      - run: |
          node --input-type=module -e "
            import { analyze } from './dist/index.js';
            import { run } from './dist/trace.js';
            const result = await run('ls /; cat /etc/hostname', { analysis: analyze('ls /') });
            if (result.execs.map((exec) => exec.refused).join() !== 'false,true') process.exit(1);
          "
      - run: npm pack --dry-run
